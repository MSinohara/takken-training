# SQL受付検証用の最小スキーマ。
# 業務上のIDを主キーにし、UUIDの採番や全件走査を不要にする。

type MemberCompany
  @table(key: "memberNo")
  @index(fields: ["branch", "district", "memberNo"])
  @index(fields: ["block", "branch", "memberNo"]) {
  memberNo: String!
  companyName: String! @index
  branch: String! @index
  district: String @index
  block: String! @index
  email: String
  representativeName: String
  sendTarget: Boolean! @default(value: true) @index
  note: String
  active: Boolean! @default(value: true) @index
}

type Person
  @table(key: "personalId")
  @index(fields: ["memberNo", "personalId"]) {
  personalId: String!
  memberNo: String!
  company: MemberCompany! @ref(fields: "memberNo", references: "memberNo")
  name: String! @index
  email: String
  personType: String
  approvalStatus: String
  active: Boolean! @default(value: true) @index
  source: String
  note: String
  autoGenerated: Boolean! @default(value: false)
}

type Organization
  @table(key: "orgId")
  @unique(fields: ["orgName"], indexName: "organization_name_uidx") {
  orgId: String!
  orgName: String! @index
  senderName: String!
  active: Boolean! @default(value: true) @index
  hostAvailable: Boolean! @default(value: false)
  csvImportName: String
  csvImportMode: String
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type EventType
  @table(key: "eventTypeId")
  @unique(fields: ["eventTypeName"], indexName: "event_type_name_uidx") {
  eventTypeId: String!
  eventTypeName: String! @index
  attendanceConfirmDefault: Boolean! @default(value: false)
  active: Boolean! @default(value: true) @index
  sortOrder: Int! @default(value: 9999) @index
  note: String
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type Venue
  @table(key: "venueId")
  @unique(fields: ["venueName", "venueAddress"], indexName: "venue_name_address_uidx") {
  venueId: String!
  venueName: String! @index
  venueAddress: String
  venueContactName: String
  venueContactPhone: String
  venueContactMail: String
  venueUrl: String
  venueApplicationUrl: String
  venueCapacity: Int
  latitude: Float
  longitude: Float
  geoRadius: Int! @default(value: 200)
  geoCheckedAt: Timestamp
  geoMemo: String
  active: Boolean! @default(value: true) @index
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type MemberOrganization
  @table(key: ["memberNo", "orgId"])
  @index(fields: ["orgId", "memberNo"]) {
  memberNo: String!
  member: MemberCompany! @ref(fields: "memberNo", references: "memberNo")
  orgId: String!
  organization: Organization! @ref(fields: "orgId", references: "orgId")
  createdAt: Timestamp! @default(expr: "request.time")
}

type PersonOrganization
  @table(key: ["personalId", "orgId"])
  @index(fields: ["orgId", "personalId"]) {
  personalId: String!
  person: Person! @ref(fields: "personalId", references: "personalId")
  orgId: String!
  organization: Organization! @ref(fields: "orgId", references: "orgId")
  source: String
  createdAt: Timestamp! @default(expr: "request.time")
}

type Training @table(key: "trainingId") {
  trainingId: String!
  title: String!
  eventDate: Date! @index
  hostType: String
  receptionType: String
  attendanceUnit: String
  checkinTargetMode: String
  eventType: String
  venueId: String
  targetBlock: String
  targetBranch: String
  targetDistrict: String
  targetOrgIdsNew: String
  senderOrganizationId: String
  certificateEnabled: Boolean
  active: Boolean
  locationCheckEnabled: Boolean
  locationCheckinStart: String
  locationCheckinEnd: String
  attendanceConfirmEnabled: Boolean
  attendanceStatusPublic: Boolean
  subject: String
  body: String
}

# 研修ごとに確定した受付対象者名簿。
# これはFirestore対策の「受付索引」ではなく、事前申込者や開催時点の対象者を
# 固定しておくための業務データ。受付済み状態は保持せず、CheckinとのJOINで判定する。
# targetType は PERSONAL / COMPANY、targetId は個人ID / 業者番号を格納する。
type TrainingTarget
  @table(key: ["trainingId", "targetType", "targetId"])
  @index(fields: ["trainingId", "targetType", "branch", "district", "targetId"])
  @index(fields: ["trainingId", "targetType", "targetId"]) {
  trainingId: String!
  training: Training! @ref(fields: "trainingId", references: "trainingId")
  targetType: String!
  targetId: String!
  memberNo: String!
  company: MemberCompany! @ref(fields: "memberNo", references: "memberNo")
  personalId: String
  person: Person @ref(fields: "personalId", references: "personalId")
  branch: String! @index
  district: String @index
  block: String! @index
}

# 当日参加予定者・事前申込者。受付対象全体とは分けて保持し、
# 受付済みかどうかは Checkin とのJOINで判定する。
type PlannedAttendee
  @table(key: "plannedId")
  @unique(
    fields: ["trainingId", "targetType", "targetId"]
    indexName: "planned_training_type_target_uidx"
  )
  @index(fields: ["trainingId", "active", "createdAt"])
  @index(fields: ["trainingId", "branch", "district", "createdAt"]) {
  plannedId: String!
  trainingId: String!
  training: Training! @ref(fields: "trainingId", references: "trainingId")
  targetType: String!
  targetId: String!
  memberNo: String
  company: MemberCompany @ref(fields: "memberNo", references: "memberNo")
  personalId: String
  person: Person @ref(fields: "personalId", references: "personalId")
  participantName: String
  email: String
  branch: String @index
  district: String @index
  block: String @index
  source: String
  active: Boolean! @default(value: true)
  createdAt: Timestamp! @default(expr: "request.time")
  removedAt: Timestamp
  removedBy: String
}

# checkinId はクライアント側でも追跡できる受付ID。
# 複合UNIQUE制約により、同じ研修・受付単位・対象者の二重受付をDBで防止する。
type Checkin
  @table(key: "checkinId")
  @unique(
    fields: ["trainingId", "attendanceUnit", "targetId"]
    indexName: "checkin_training_unit_target_uidx"
  )
  @index(fields: ["trainingId", "checkedInAt"])
  @index(fields: ["trainingId", "memberNo", "checkedInAt"]) {
  checkinId: String!
  trainingId: String!
  training: Training! @ref(fields: "trainingId", references: "trainingId")
  memberNo: String!
  company: MemberCompany! @ref(fields: "memberNo", references: "memberNo")
  personalId: String
  person: Person @ref(fields: "personalId", references: "personalId")
  attendanceUnit: String!
  targetId: String!
  checkedInAt: Timestamp! @default(expr: "request.time")
  checkinMethod: String!
  cancelled: Boolean! @default(value: false)
  canceledAt: Timestamp
  canceledBy: String
  cancelReason: String
  restoredAt: Timestamp
  restoredBy: String
  restoreReason: String
}

# 会員マスタに存在しない一般参加者の受付。会員受付とは分離して保存する。
type GuestCheckin
  @table(key: "checkinId")
  @unique(fields: ["trainingId", "guestKey"], indexName: "guest_checkin_training_key_uidx")
  @index(fields: ["trainingId", "checkedInAt"]) {
  checkinId: String!
  trainingId: String!
  training: Training! @ref(fields: "trainingId", references: "trainingId")
  guestKey: String!
  participantName: String!
  organizationName: String
  block: String
  branch: String
  email: String
  phone: String
  receptionCategory: String! @default(value: "一般参加")
  checkinMethod: String!
  checkedInAt: Timestamp! @default(expr: "request.time")
  cancelled: Boolean! @default(value: false)
}
