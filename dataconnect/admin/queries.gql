# Firebase CLIからだけ実行する開発データ移行操作。
# NO_ACCESSにして、ブラウザや一般クライアントからの実行を禁止する。
mutation AdminUpsertMemberCompanies(
  $data: [MemberCompany_Data!]! @allow(fields: "memberNo companyName branch district block email representativeName sendTarget note active")
) @transaction @auth(level: NO_ACCESS) {
  memberCompany_upsertMany(data: $data)
}

mutation AdminUpsertPeople(
  $data: [Person_Data!]! @allow(fields: "personalId memberNo name email personType approvalStatus active source note autoGenerated")
) @transaction @auth(level: NO_ACCESS) {
  person_upsertMany(data: $data)
}

mutation AdminUpsertOrganizations(
  $data: [Organization_Data!]! @allow(fields: "orgId orgName senderName active hostAvailable csvImportName csvImportMode createdAt updatedAt")
) @transaction @auth(level: NO_ACCESS) {
  organization_upsertMany(data: $data)
}

mutation AdminUpsertEventTypes(
  $data: [EventType_Data!]! @allow(fields: "eventTypeId eventTypeName attendanceConfirmDefault active sortOrder note createdAt updatedAt")
) @transaction @auth(level: NO_ACCESS) {
  eventType_upsertMany(data: $data)
}

mutation AdminUpsertVenues(
  $data: [Venue_Data!]! @allow(fields: "venueId venueName venueAddress venueContactName venueContactPhone venueContactMail venueUrl venueApplicationUrl venueCapacity latitude longitude geoRadius geoCheckedAt geoMemo active createdAt updatedAt")
) @transaction @auth(level: NO_ACCESS) {
  venue_upsertMany(data: $data)
}

mutation AdminUpsertDistricts(
  $data: [District_Data!]! @allow(fields: "branch districtName active sortOrder createdAt updatedAt")
) @transaction @auth(level: NO_ACCESS) {
  district_upsertMany(data: $data)
}

mutation AdminUpsertMemberOrganizations(
  $data: [MemberOrganization_Data!]! @allow(fields: "memberNo orgId createdAt")
) @transaction @auth(level: NO_ACCESS) {
  memberOrganization_upsertMany(data: $data)
}

mutation AdminUpsertPersonOrganizations(
  $data: [PersonOrganization_Data!]! @allow(fields: "personalId orgId source createdAt")
) @transaction @auth(level: NO_ACCESS) {
  personOrganization_upsertMany(data: $data)
}

mutation AdminUpsertTrainings(
  $data: [Training_Data!]! @allow(fields: "trainingId title eventDate")
) @transaction @auth(level: NO_ACCESS) {
  training_upsertMany(data: $data)
}

mutation AdminUpsertTrainingDetails(
  $data: [Training_Data!]! @allow(fields: "trainingId title eventDate hostType receptionType attendanceUnit checkinTargetMode eventType venueId targetBlock targetBranch targetDistrict targetOrgIdsNew senderOrganizationId certificateEnabled active locationCheckEnabled locationCheckinStart locationCheckinEnd attendanceConfirmEnabled attendanceStatusPublic subject body")
) @transaction @auth(level: NO_ACCESS) {
  training_upsertMany(data: $data)
}

mutation AdminUpsertTrainingTargets(
  $data: [TrainingTarget_Data!]! @allow(fields: "trainingId targetType targetId memberNo personalId branch district block")
) @transaction @auth(level: NO_ACCESS) {
  trainingTarget_upsertMany(data: $data)
}

mutation AdminUpsertPlannedAttendees(
  $data: [PlannedAttendee_Data!]! @allow(fields: "plannedId trainingId targetType targetId memberNo personalId participantName email branch district block source active createdAt removedAt removedBy")
) @transaction @auth(level: NO_ACCESS) {
  plannedAttendee_upsertMany(data: $data)
}

query AdminMigrationVerification @auth(level: NO_ACCESS) {
  memberCompanies(limit: 5000) { memberNo }
  people(limit: 5000) { personalId }
  organizations(limit: 5000) { orgId }
  memberOrganizations(limit: 5000) { memberNo orgId }
  personOrganizations(limit: 5000) { personalId orgId }
  trainings(limit: 5000) { trainingId }
  trainingTargets(limit: 5000) { trainingId targetType targetId }
  plannedAttendees(limit: 5000) { plannedId trainingId targetType targetId }
  checkins(limit: 5000) { checkinId }
}
