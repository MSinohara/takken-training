specVersion: "v1"
serviceId: "takken-training"
location: "asia-northeast1"
schemas:
  - source: "./schema"
    datasource:
      postgresql:
        database: "fdcdb"
        cloudSql:
          instanceId: "takken-training-demo-fdc"
          # schemaValidation: "STRICT"     # STRICT mode makes Postgres schema match Data Connect exactly.
          schemaValidation: "COMPATIBLE" # Keep existing tables while applying Data Connect-compatible changes.
connectorDirs: ["./example", "./admin"]
