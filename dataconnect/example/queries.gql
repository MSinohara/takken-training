mutation AddPlannedAttendee(
  $plannedId: String!
  $trainingId: String!
  $targetType: String!
  $targetId: String!
  $memberNo: String
  $personalId: String
  $participantName: String
  $email: String
  $branch: String
  $district: String
  $block: String
  $source: String
) @transaction @auth(expr: "auth.token.email == 'ohzakai.kk@gmail.com'") {
  plannedAttendee_upsert(
    data: {
      plannedId: $plannedId
      trainingId: $trainingId
      targetType: $targetType
      targetId: $targetId
      memberNo: $memberNo
      personalId: $personalId
      participantName: $participantName
      email: $email
      branch: $branch
      district: $district
      block: $block
      source: $source
      active: true
    }
  )
}

mutation RemovePlannedAttendee(
  $plannedId: String!
  $changedAt: Timestamp!
  $operator: String
) @auth(expr: "auth.token.email == 'ohzakai.kk@gmail.com'") {
  plannedAttendee_update(
    key: { plannedId: $plannedId }
    data: { active: false removedAt: $changedAt removedBy: $operator }
  )
}
