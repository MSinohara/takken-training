}

query AdminSearchPeople(
  $keyword: String! = ""
  $branch: String
  $active: Boolean
  $emailMissing: Boolean
  $limit: Int = 10
  $offset: Int = 0
) @auth(expr: "auth.token.email == 'ohzakai.kk@gmail.com'") {
  rows: people(
    where: {
      _and: [
        { _or: [
          { name: { contains: $keyword } }
          { memberNo: { startsWith: $keyword } }
          { company: { companyName: { contains: $keyword } } }
        ] }
        { active: { eq: $active } }
        { email: { isNull: $emailMissing } }
        { company: { branch: { eq: $branch } } }
      ]
    }
    orderBy: [{ personalId: ASC }]
    limit: $limit
    offset: $offset
  ) {
    personalId
    memberNo
    name
    email
    personType
    approvalStatus
    active
    source
    note
    autoGenerated
    company { companyName branch district block }
  }
  total: people(
    where: {
      _and: [
        { _or: [
          { name: { contains: $keyword } }
          { memberNo: { startsWith: $keyword } }
          { company: { companyName: { contains: $keyword } } }
        ] }
        { active: { eq: $active } }
        { email: { isNull: $emailMissing } }
        { company: { branch: { eq: $branch } } }
      ]
    }
  ) { _count }
}

