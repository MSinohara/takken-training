query PlannedAttendeeSummary($trainingId: String!)
  @auth(level: PUBLIC, insecureReason: "SQL受付モニターの予定者件数表示に限定して使用するため。") {
  planned: plannedAttendees(
    where: { trainingId: { eq: $trainingId }, active: { eq: true } }
  ) { _count }
  personalReceived: plannedAttendees(
    where: {
      _and: [
        { trainingId: { eq: $trainingId }, active: { eq: true }, targetType: { eq: "PERSONAL" } }
        { person: { checkins_on_person: { exist: { trainingId: { eq: $trainingId }, attendanceUnit: { eq: "PERSONAL" }, cancelled: { eq: false } } } } }
      ]
    }
  ) { _count }
  companyReceived: plannedAttendees(
    where: {
      _and: [
        { trainingId: { eq: $trainingId }, active: { eq: true }, targetType: { eq: "COMPANY" } }
        { company: { checkins_on_company: { exist: { trainingId: { eq: $trainingId }, attendanceUnit: { eq: "COMPANY" }, cancelled: { eq: false } } } } }
      ]
    }
  ) { _count }
}

