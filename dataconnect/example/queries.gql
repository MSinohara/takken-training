# 支部・地区別の受付件数は、明細を送らずSQL側でグループ集計する。
query TrainingCheckinsByBranchDistrict(
  $trainingId: String!
  $attendanceUnit: String!
) @auth(level: PUBLIC, insecureReason: "SQL受付検証環境の支部地区別集計に限定して使用するため。") {
  checkins(
    where: { trainingId: { eq: $trainingId }, attendanceUnit: { eq: $attendanceUnit }, cancelled: { eq: false } }
  ) {
    company {
      branch
      district
    }
    _count
  }
}

# 確定対象者名簿と受付履歴をDB内で照合し、未受付の個人だけを取得する。
# クライアントへの全件送信や、別の受付索引・同期処理は行わない。
query SearchUncheckedTargets(
  $trainingId: String!
  $branch: String
  $district: String
  $limit: Int = 50
  $offset: Int = 0
) @auth(level: PUBLIC, insecureReason: "SQL受付検証環境の未受付者検索に限定して使用するため。") {
  trainingTargets(
    where: {
      _and: [
        {
          trainingId: { eq: $trainingId }
          targetType: { eq: "PERSONAL" }
          branch: { eq: $branch }
          district: { eq: $district }
        }
        {
          _not: {
            person: {
              checkins_on_person: {
                exist: { trainingId: { eq: $trainingId }, attendanceUnit: { eq: "PERSONAL" }, cancelled: { eq: false } }
              }
            }
          }
        }
      ]
    }
    orderBy: [{ targetId: ASC }]
    limit: $limit
    offset: $offset
  ) {
    targetId
    branch
    district
    company {
      memberNo
      companyName
    }
    person {
      personalId
      name
      email
    }
  }
}

