# 参加履歴画面と受付取消・復活画面で使用する。全件走査せず新しい順に取得する。
query ListCheckinHistory(
  $trainingId: String
  $limit: Int = 50
  $offset: Int = 0
) @auth(expr: "auth.token.email == 'ohzakai.kk@gmail.com'") {
  checkins(
    where: { trainingId: { eq: $trainingId } }
    orderBy: [{ checkedInAt: DESC }]
    limit: $limit
    offset: $offset
  ) {
    checkinId
    trainingId
    checkedInAt
    checkinMethod
    attendanceUnit
    cancelled
    canceledAt
    canceledBy
    cancelReason
    restoredAt
    restoredBy
    restoreReason
    training { title eventDate }
    company { memberNo companyName block branch district email }
    person { personalId name email }
  }
}

mutation CancelCheckin(
  $checkinId: String!
  $changedAt: Timestamp!
  $operator: String
  $reason: String
) @auth(expr: "auth.token.email == 'ohzakai.kk@gmail.com'") {
  checkin_update(
    key: { checkinId: $checkinId }
    data: {
      cancelled: true
      canceledAt: $changedAt
      canceledBy: $operator
      cancelReason: $reason
    }
  )
}

mutation RestoreCheckin(
  $checkinId: String!
  $changedAt: Timestamp!
  $operator: String
  $reason: String
) @auth(expr: "auth.token.email == 'ohzakai.kk@gmail.com'") {
  checkin_update(
    key: { checkinId: $checkinId }
    data: {
      cancelled: false
      restoredAt: $changedAt
      restoredBy: $operator
      restoreReason: $reason
    }
  )
}

# 係員が取り消した受付を、参加者本人が会場QRから再受付する場合だけ使用する。
# 通常の新規受付はUNIQUE制約で止まり、画面側で取消済みを確認してから呼び出す。
mutation RestoreCancelledCheckinPublic(
  $checkinId: String!
  $changedAt: Timestamp!
) @auth(level: PUBLIC, insecureReason: "係員取消後に参加者本人が会場QRから再受付するため。") {
  checkin_updateMany(
    where: {
      checkinId: { eq: $checkinId }
      cancelled: { eq: true }
    }
    data: {
      cancelled: false
      restoredAt: $changedAt
      restoredBy: "会場QR再受付"
      restoreReason: "参加者による再受付"
    }
  )
}

# 当日参加予定者は受付対象全体とは別に管理する。管理者だけが追加・削除できる。
query GetPlannedAttendee($plannedId: String!)
  @auth(expr: "auth.token.email == 'ohzakai.kk@gmail.com'") {
  plannedAttendee(key: { plannedId: $plannedId }) {
    plannedId
    active
  }
}

# 事前登録QRに含まれる予定者IDを、指定研修の有効な予定者に限定して照合する。
query GetPlannedAttendeeForCheckin(
  $plannedId: String!
  $trainingId: String!
) @auth(level: PUBLIC, insecureReason: "事前登録QRを読み取った本人の受付対象確認に限定して使用するため。") {
  plannedAttendees(
    where: {
      plannedId: { eq: $plannedId }
      trainingId: { eq: $trainingId }
      active: { eq: true }
    }
    limit: 1
  ) {
    plannedId
    targetType
    targetId
    memberNo
    personalId
    participantName
    company { memberNo companyName }
    person { personalId name }
  }
}

