# SQL受付検証専用の操作。現在は認証UIを作らないためPUBLICにしている。
# 実運用へ移す際は管理者・受付担当者の認証条件へ変更する。

query ListTrainings($limit: Int = 200)
  @auth(level: PUBLIC, insecureReason: "SQL受付検証環境の研修選択に限定して使用するため。") {
  trainings(orderBy: [{ eventDate: DESC }, { trainingId: DESC }], limit: $limit) {
    trainingId
    title
    eventDate
    hostType
    receptionType
    attendanceUnit
    checkinTargetMode
    eventType
    venueId
    targetBlock
    targetBranch
    targetDistrict
    targetOrgIdsNew
    senderOrganizationId
    certificateEnabled
    active
    locationCheckEnabled
    locationCheckinStart
    locationCheckinEnd
    attendanceConfirmEnabled
    attendanceStatusPublic
    subject
    body
  }
}

mutation SaveTraining(
  $trainingId: String!
  $title: String!
  $eventDate: Date!
  $hostType: String
  $receptionType: String
  $attendanceUnit: String
  $checkinTargetMode: String
  $eventType: String
  $venueId: String
  $targetBlock: String
  $targetBranch: String
  $targetDistrict: String
  $targetOrgIdsNew: String
  $senderOrganizationId: String
  $certificateEnabled: Boolean
  $active: Boolean
  $locationCheckEnabled: Boolean
  $locationCheckinStart: String
  $locationCheckinEnd: String
  $attendanceConfirmEnabled: Boolean
  $attendanceStatusPublic: Boolean
  $subject: String
  $body: String
) @auth(expr: "auth.token.email == 'ohzakai.kk@gmail.com'") {
  training_upsert(
    data: {
      trainingId: $trainingId
      title: $title
      eventDate: $eventDate
      hostType: $hostType
      receptionType: $receptionType
      attendanceUnit: $attendanceUnit
      checkinTargetMode: $checkinTargetMode
      eventType: $eventType
      venueId: $venueId
      targetBlock: $targetBlock
      targetBranch: $targetBranch
      targetDistrict: $targetDistrict
      targetOrgIdsNew: $targetOrgIdsNew
      senderOrganizationId: $senderOrganizationId
      certificateEnabled: $certificateEnabled
      active: $active
      locationCheckEnabled: $locationCheckEnabled
      locationCheckinStart: $locationCheckinStart
      locationCheckinEnd: $locationCheckinEnd
      attendanceConfirmEnabled: $attendanceConfirmEnabled
      attendanceStatusPublic: $attendanceStatusPublic
      subject: $subject
      body: $body
    }
  )
}

mutation ReplaceTrainingTargets(
  $trainingId: String!
  $data: [TrainingTarget_Data!]! @allow(fields: "trainingId targetType targetId memberNo personalId branch district block")
) @transaction @auth(expr: "auth.token.email == 'ohzakai.kk@gmail.com'") {
  trainingTarget_deleteMany(where: { trainingId: { eq: $trainingId } })
  trainingTarget_upsertMany(data: $data)
}

query AdminSearchMemberCompanies(
  $keyword: String! = ""
  $branch: String
  $sendTarget: Boolean
  $active: Boolean
  $emailMissing: Boolean
  $limit: Int = 10
  $offset: Int = 0
) @auth(expr: "auth.token.email == 'ohzakai.kk@gmail.com'") {
  rows: memberCompanies(
    where: {
      _and: [
        { _or: [
          { memberNo: { startsWith: $keyword } }
          { companyName: { contains: $keyword } }
          { representativeName: { contains: $keyword } }
          { email: { contains: $keyword } }
        ] }
        { branch: { eq: $branch } }
        { sendTarget: { eq: $sendTarget } }
        { active: { eq: $active } }
        { email: { isNull: $emailMissing } }
      ]
    }
    orderBy: [{ memberNo: ASC }]
    limit: $limit
    offset: $offset
  ) {
    memberNo
    companyName
    representativeName
    email
    branch
    district
    block
    sendTarget
    note
    active
  }
  total: memberCompanies(
    where: {
      _and: [
        { _or: [
          { memberNo: { startsWith: $keyword } }
          { companyName: { contains: $keyword } }
          { representativeName: { contains: $keyword } }
          { email: { contains: $keyword } }
        ] }
        { branch: { eq: $branch } }
        { sendTarget: { eq: $sendTarget } }
        { active: { eq: $active } }
        { email: { isNull: $emailMissing } }
      ]
    }
  ) { _count }
}

mutation AdminSaveMemberSetting(
