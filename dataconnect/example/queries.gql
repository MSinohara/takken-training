# SQL受付検証専用の操作。現在は認証UIを作らないためPUBLICにしている。
# 実運用へ移す際は管理者・受付担当者の認証条件へ変更する。

query ListTrainings($limit: Int = 200)
  @auth(level: PUBLIC, insecureReason: "SQL受付検証環境の研修選択に限定して使用するため。") {
  trainings(orderBy: [{ eventDate: DESC }, { trainingId: DESC }], limit: $limit) {
    trainingId
    title
    eventDate
    hostType
    receptionType
    attendanceUnit
    checkinTargetMode
    eventType
    venueId
    targetBlock
    targetBranch
    targetDistrict
    targetOrgIdsNew
    senderOrganizationId
    certificateEnabled
    active
    locationCheckEnabled
    locationCheckinStart
    locationCheckinEnd
    attendanceConfirmEnabled
    attendanceStatusPublic
    subject
    body
  }
}

query SearchMemberCompanies(
  $memberNo: String
  $companyName: String
  $branch: String
  $district: String
  $limit: Int = 50
  $offset: Int = 0
) @auth(level: PUBLIC, insecureReason: "SQL受付検証環境の会員検索に限定して使用するため。") {
  memberCompanies(
    where: {
      memberNo: { startsWith: $memberNo }
      companyName: { contains: $companyName }
      branch: { eq: $branch }
      district: { eq: $district }
    }
    orderBy: [{ memberNo: ASC }]
    limit: $limit
    offset: $offset
  ) {
    memberNo
    companyName
    branch
    district
    block
    email
    people_on_company {
      personalId
      name
      email
    }
  }
}

query GetPersonForCheckin($personalId: String!)
  @auth(level: PUBLIC, insecureReason: "SQL受付検証環境の受付候補確認に限定して使用するため。") {
  person(key: { personalId: $personalId }) {
    personalId
    name
    email
    company {
      memberNo
      companyName
      branch
      district
      block
    }
  }
}

# 受付時の対象者確認は、名簿全件を読み込まず複合主キーで1件だけ取得する。
query GetTrainingTargetForCheckin(
  $trainingId: String!
  $targetType: String!
  $targetId: String!
) @auth(level: PUBLIC, insecureReason: "SQL受付検証環境の受付対象確認に限定して使用するため。") {
  trainingTarget(
    key: {
      trainingId: $trainingId
      targetType: $targetType
      targetId: $targetId
    }
  ) {
    targetType
    targetId
    memberNo
    personalId
    branch
    district
    block
  }
}

mutation RegisterPersonalCheckin(
  $checkinId: String!
  $trainingId: String!
  $memberNo: String!
  $personalId: String!
  $checkinMethod: String!
) @transaction
  @auth(level: PUBLIC, insecureReason: "SQL受付検証環境の並列受付試験に限定して使用するため。") {
  checkin_insert(
    data: {
      checkinId: $checkinId
      trainingId: $trainingId
      memberNo: $memberNo
      personalId: $personalId
      attendanceUnit: "PERSONAL"
      targetId: $personalId
      checkinMethod: $checkinMethod
    }
  )
}

mutation RegisterCompanyCheckin(
  $checkinId: String!
  $trainingId: String!
  $memberNo: String!
  $checkinMethod: String!
) @transaction
  @auth(level: PUBLIC, insecureReason: "SQL受付検証環境の将来の会社受付確認に限定して使用するため。") {
  checkin_insert(
    data: {
      checkinId: $checkinId
      trainingId: $trainingId
      memberNo: $memberNo
      attendanceUnit: "COMPANY"
      targetId: $memberNo
      checkinMethod: $checkinMethod
    }
  )
}

query RecentCheckins($trainingId: String!, $limit: Int = 10)
  @auth(level: PUBLIC, insecureReason: "SQL受付検証環境の受付モニターに限定して使用するため。") {
  checkins(
    where: { trainingId: { eq: $trainingId } }
    orderBy: [{ checkedInAt: DESC }]
    limit: $limit
  ) {
    checkinId
    checkedInAt
    checkinMethod
    attendanceUnit
    company {
      memberNo
      companyName
    }
    person {
      personalId
      name
    }
  }
}

# 一覧を読み込まず、SQLの集約だけで当日の基本件数を取得する。
query TrainingCheckinSummary(
  $trainingId: String!
  $targetType: String!
  $attendanceUnit: String!
) @auth(level: PUBLIC, insecureReason: "SQL受付検証環境の件数集計に限定して使用するため。") {
  targets: trainingTargets(
    where: { trainingId: { eq: $trainingId }, targetType: { eq: $targetType } }
  ) {
    _count
  }
  received: checkins(
    where: { trainingId: { eq: $trainingId }, attendanceUnit: { eq: $attendanceUnit } }
  ) {
    _count
  }
}

# 支部・地区別の受付件数は、明細を送らずSQL側でグループ集計する。
query TrainingCheckinsByBranchDistrict(
  $trainingId: String!
  $attendanceUnit: String!
) @auth(level: PUBLIC, insecureReason: "SQL受付検証環境の支部地区別集計に限定して使用するため。") {
  checkins(
    where: { trainingId: { eq: $trainingId }, attendanceUnit: { eq: $attendanceUnit } }
  ) {
    company {
      branch
      district
    }
    _count
  }
}

# 確定対象者名簿と受付履歴をDB内で照合し、未受付の個人だけを取得する。
# クライアントへの全件送信や、別の受付索引・同期処理は行わない。
query SearchUncheckedTargets(
  $trainingId: String!
  $branch: String
  $district: String
  $limit: Int = 50
  $offset: Int = 0
) @auth(level: PUBLIC, insecureReason: "SQL受付検証環境の未受付者検索に限定して使用するため。") {
  trainingTargets(
    where: {
      _and: [
        {
          trainingId: { eq: $trainingId }
          targetType: { eq: "PERSONAL" }
          branch: { eq: $branch }
          district: { eq: $district }
        }
        {
          _not: {
            person: {
              checkins_on_person: {
                exist: { trainingId: { eq: $trainingId }, attendanceUnit: { eq: "PERSONAL" } }
              }
            }
          }
        }
      ]
    }
    orderBy: [{ targetId: ASC }]
    limit: $limit
    offset: $offset
  ) {
    targetId
    branch
    district
    company {
      memberNo
      companyName
    }
    person {
      personalId
      name
      email
    }
  }
}

# 会社単位の確定対象名簿と受付履歴をDB内で照合し、未受付会社だけを取得する。
query SearchUncheckedCompanyTargets(
  $trainingId: String!
  $branch: String
  $district: String
  $limit: Int = 50
  $offset: Int = 0
) @auth(level: PUBLIC, insecureReason: "SQL受付検証環境の未受付会社検索に限定して使用するため。") {
  trainingTargets(
    where: {
      _and: [
        {
          trainingId: { eq: $trainingId }
          targetType: { eq: "COMPANY" }
          branch: { eq: $branch }
          district: { eq: $district }
        }
        {
          _not: {
            company: {
              checkins_on_company: {
                exist: { trainingId: { eq: $trainingId }, attendanceUnit: { eq: "COMPANY" } }
              }
            }
          }
        }
      ]
    }
    orderBy: [{ targetId: ASC }]
    limit: $limit
    offset: $offset
  ) {
    targetType
    targetId
    branch
    district
    company {
      memberNo
      companyName
      email
    }
  }
}

query GetCheckin($checkinId: String!)
  @auth(level: PUBLIC, insecureReason: "SQL受付検証環境の整合性確認に限定して使用するため。") {
  checkin(key: { checkinId: $checkinId }) {
    checkinId
    trainingId
    attendanceUnit
    targetId
    checkedInAt
  }
}
