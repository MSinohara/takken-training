<!doctype html>
<html lang="ja"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SQL受付負荷試験</title><link rel="stylesheet" href="css/app.css">
  <script type="importmap">{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js","firebase/data-connect":"https://www.gstatic.com/firebasejs/12.11.0/firebase-data-connect.js"}}</script>
</head><body>
  <header><h1>SQL受付負荷試験</h1></header>
  <nav><a href="index.html">受付</a><a href="monitor.html">受付モニター</a><a href="load-test.html">負荷試験</a><a href="../training-menu.html">研修会管理へ戻る</a></nav>
  <main>
    <section class="panel"><h2>試験条件</h2>
      <div class="grid">
        <label>試験枠<select id="slot"><option value="SQL-LOAD-01">試験枠1</option><option value="SQL-LOAD-02">試験枠2</option><option value="SQL-LOAD-03">試験枠3</option></select></label>
        <label>試験モード<select id="mode"><option value="different">異なる参加者の同時受付</option><option value="same">同一人物の同時受付</option></select></label>
        <label>同時受付数<select id="count"><option>1</option><option>2</option><option selected>5</option><option>10</option></select></label>
      </div>
      <div class="actions"><button id="run">負荷試験を実行</button></div>
      <p id="status" class="status">未使用の試験枠を選んで実行してください。同じ枠の再実行は既受付の測定になります。</p>
    </section>
    <section id="summaryPanel" class="panel" hidden><h2>試験結果</h2><div id="summary" class="grid"></div></section>
    <section id="detailPanel" class="panel" hidden><h2>個別結果</h2><div id="details"></div></section>
  </main><script type="module" src="js/load-test.js?v=16"></script>
</body></html>
