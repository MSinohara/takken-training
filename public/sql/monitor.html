<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SQL受付モニター</title>
  <link rel="stylesheet" href="css/app.css">
  <script type="importmap">
    {"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js","firebase/data-connect":"https://www.gstatic.com/firebasejs/12.11.0/firebase-data-connect.js"}}
  </script>
</head>
<body>
  <header><h1>SQL受付モニター</h1></header>
  <nav><a href="index.html">受付</a><a href="monitor.html">受付モニター</a><a href="load-test.html">負荷試験</a><a href="../training-menu.html">研修会管理へ戻る</a></nav>
  <main>
    <section class="panel">
      <h2>直近の受付</h2>
      <div class="grid"><label>対象研修<select id="training"></select></label></div>
      <div class="actions"><button id="refresh">今すぐ更新</button><button id="breakdown" class="secondary">支部・地区別を見る</button></div>
      <p id="status" class="status"></p>
    </section>
    <section class="panel">
      <h2>受付状況</h2>
      <div id="summary" class="grid">
        <div class="metric"><span class="muted">参加対象</span><strong id="target-count">-</strong></div>
        <div class="metric"><span class="muted">受付済み</span><strong id="received-count">-</strong></div>
        <div class="metric"><span class="muted">未受付</span><strong id="unchecked-count">-</strong></div>
        <div class="metric"><span class="muted">参加率</span><strong id="attendance-rate">-</strong></div>
      </div>
      <div id="breakdown-list" class="empty" hidden></div>
    </section>
    <section class="panel">
      <div id="list" class="empty">受付履歴を読み込んでいます。</div>
    </section>
    <section class="panel">
      <h2>未受付者一覧</h2>
      <p class="muted">必要な時だけ検索します。最初は50件まで表示し、次の50件を追加で読み込めます。</p>
      <div class="grid">
        <label>支部
          <select id="branch">
            <option value="">指定なし</option>
            <option value="杉並区支部">杉並区支部</option>
            <option value="中野区支部">中野区支部</option>
            <option value="世田谷区支部">世田谷区支部</option>
          </select>
        </label>
        <label>地区
          <input id="district" type="text" placeholder="指定なし">
        </label>
      </div>
      <div class="actions">
        <button id="search-unchecked">未受付者を検索</button>
        <button id="previous" class="secondary" disabled>前の50件</button>
        <button id="next" class="secondary" disabled>次の50件</button>
      </div>
      <p id="unchecked-status" class="status"></p>
      <div id="unchecked-list" class="empty">支部・地区を必要に応じて指定し、「未受付者を検索」を押してください。</div>
    </section>
  </main>
  <script type="module" src="js/monitor.js?v=16"></script>
</body>
</html>
