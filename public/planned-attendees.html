<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>事前申込者・当日参加予定者</title>
  <link rel="stylesheet" href="sql/css/app.css">
  <script type="importmap">
    {"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js","firebase/auth":"https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js","firebase/data-connect":"https://www.gstatic.com/firebasejs/12.11.0/firebase-data-connect.js"}}
  </script>
</head>
<body>
  <header><h1>事前申込者・当日参加予定者</h1></header>
  <nav><a id="detailLink" href="training-list.html">研修会詳細へ戻る</a><a href="training-menu.html">研修会管理</a><a href="index.html">トップ</a></nav>
  <main>
    <section class="panel">
      <h2>対象イベント</h2>
      <p id="trainingInfo" class="status">イベント情報を読み込み中...</p>
    </section>
    <section class="panel">
      <h2>会員から予定者を追加</h2>
      <p class="muted">会員マスタから会社を検索し、参加する個人を選択します。</p>
      <div class="grid">
        <label>支部<select id="branch"><option value="">指定なし</option><option>杉並区支部</option><option>中野区支部</option><option>世田谷区支部</option></select></label>
        <label>地区<input id="district" placeholder="指定なし"></label>
        <label>業者番号<input id="memberNo" inputmode="numeric" placeholder="例: 90001"></label>
        <label>会社名<input id="companyName" placeholder="会社名の一部"></label>
      </div>
      <div class="actions"><button id="search" disabled>検索</button><button id="clear" class="secondary" disabled>入力を消す</button></div>
      <p id="searchStatus" class="status">管理者確認後に検索できます。</p>
      <div id="searchResults"></div>
    </section>
    <section class="panel">
      <div class="section-heading">
        <div><h2>登録済み予定者</h2><p class="muted">最初は50件を表示します。必要な場合だけ次の50件を読み込みます。</p></div>
        <button id="reload" class="secondary" disabled>再読み込み</button>
      </div>
      <p id="listStatus" class="status">予定者一覧を読み込み中...</p>
      <div id="plannedList"></div>
      <div class="actions"><button id="prev" class="secondary" disabled>前の50件</button><button id="next" class="secondary" disabled>次の50件</button></div>
    </section>
  </main>
  <script type="module" src="sql/js/planned-attendees.js?v=1"></script>
</body>
</html>
