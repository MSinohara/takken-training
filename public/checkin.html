<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>受付画面</title>

<link rel="stylesheet" href="css/common.css">
<script src="js/common.js"></script>
<script type="importmap">
{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js","firebase/data-connect":"https://www.gstatic.com/firebasejs/12.11.0/firebase-data-connect.js"}}
</script>
<script type="module" src="sql/js/qr-checkin.js?v=17"></script>

<style>
main{
  max-width:720px;
}

#code{
  font-size:22px;
  padding:14px;
  margin-top:12px;
}

.checkin-result{
  font-size:20px;
  text-align:center;
}

.checkin-result .ok{
  font-size:26px;
}

.checkin-result .ng{
  font-size:24px;
}
</style>
</head>

<body>

<header>
  <h1>受付画面</h1>
</header>

<main>
  <div class="card">

    <p class="muted">
      QRコードまたはバーコードの読取値を入力してください。<br>
      例：MEMBER:00000
    </p>

    <input id="code" placeholder="MEMBER:00000" autofocus autocomplete="off">

    <div class="actions">
      <button class="btn" onclick="checkin()">受付する</button>
      <a class="btn sub" id="detailLink" href="checkin-select.html">受付メニューへ戻る</a>
    </div>

    <div id="result" class="result checkin-result"></div>

  </div>
</main>

<script>
const params =
  new URLSearchParams(location.search);

const eventId =
  params.get("event") || "";

const returnTo =
  params.get("return") || "";

let currentTraining =
  null;

function setupBackLink(){

  const link =
    document.getElementById("detailLink");

  if(returnTo === "detail" && eventId){
    link.href =
      "training-detail.html?event=" + encodeURIComponent(eventId);

    link.textContent =
      "研修会詳細へ戻る";

    return;
  }

  link.href =
    "checkin-select.html";

  link.textContent =
    "受付メニューへ戻る";
}

async function loadTraining(){

  if(!eventId){
    return;
  }

  try {
    currentTraining = await waitForSqlQr().then(function(api){ return api.getTraining(eventId); });
  } catch(error) {
    document.getElementById("result").innerHTML = '<div class="ng">' + escapeHtml(error.message || String(error)) + '</div>';
  }
}

function waitForSqlQr(){
  if(window.sqlQrCheckin){ return Promise.resolve(window.sqlQrCheckin); }
  return new Promise(function(resolve, reject){
    const startedAt = Date.now();
    const timer = setInterval(function(){
      if(window.sqlQrCheckin){ clearInterval(timer); resolve(window.sqlQrCheckin); }
      else if(Date.now() - startedAt >= 10000){
        clearInterval(timer);
        reject(new Error("SQL受付機能を読み込めませんでした。画面を再読み込みしてください。"));
      }
    }, 50);
  });
}

async function checkin(){

  if(!eventId){
    alert("研修IDが指定されていません。");
    return;
  }

  const code =
    document.getElementById("code").value.trim();

  if(!code){
    alert("読取値を入力してください。");
    return;
  }

  const result =
    document.getElementById("result");

  result.style.display =
    "block";

  result.textContent =
    "受付処理中...";

	try {
      const api = await waitForSqlQr();
      const res = await api.register(eventId, code, "会社・個人QR受付");

      if(!res || !res.ok){
        result.innerHTML =
          '<div class="ng">' +
          escapeHtml(res && res.message ? res.message : "受付に失敗しました。") +
          '</div>';
        return;
      }

      result.innerHTML =
        '<div class="ok">' +
        escapeHtml(res.message || "受付完了") +
        '</div>' +

        '<div>' +
        escapeHtml(res.companyName || "") +
        ' 様</div>' +

        (
          res.participantName
            ? '<div>' + escapeHtml(res.participantName) + ' 様</div>'
            : ''
        ) +

        (
          res.memberNo
            ? '<div>業者番号：' + escapeHtml(res.memberNo || "") + '</div>'
            : ''
        ) +

        (
          res.personalId
            ? '<div>個人ID：' + escapeHtml(res.personalId) + '</div>'
            : ''
        ) +

        (
          res.outside
            ? '<div>対象外参加として受付しました。</div>'
            : ''
        ) +

        (
          res.checkedAt
            ? '<div>受付日時：' + escapeHtml(res.checkedAt) + '</div>'
            : ''
        );

      document.getElementById("code").value =
        "";

      document.getElementById("code").focus();
    } catch(error) {
      result.innerHTML = '<div class="ng">' + escapeHtml(error.message || String(error)) + '</div>';
    }
}

document.addEventListener("DOMContentLoaded", function(){

  const input =
    document.getElementById("code");

  input.focus();

  input.addEventListener("keydown", function(e){

    if(e.key === "Enter"){
      e.preventDefault();
      checkin();
    }

  });

  document.body.addEventListener("click", function(){
    input.focus();
  });

});

setupBackLink();
loadTraining();
</script>

</body>
</html>
