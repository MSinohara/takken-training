<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>研修会記録一覧</title>

<link rel="stylesheet" href="css/common.css">
<script src="js/common.js"></script>

<style>
main{
  max-width:1200px;
}

.record-summary{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  align-items:flex-start;
  min-width:160px;
}

.money{
  text-align:right;
  white-space:nowrap;
}

.memo-cell{
  max-width:300px;
}

.record-title{
  font-weight:bold;
  line-height:1.5;
}

.record-sub{
  margin-top:4px;
  color:#666;
  font-size:12px;
  line-height:1.5;
}

.record-chip{
  display:inline-block;
  padding:4px 7px;
  border-radius:8px;
  background:#f0f2f5;
  font-size:12px;
  line-height:1.4;
  white-space:nowrap;
}

.record-chip.strong{
  background:#e7f0ff;
  color:#12345a;
  font-weight:bold;
}

.compact-text{
  line-height:1.6;
  font-size:13px;
}

.memo-preview{
  margin-top:4px;
  color:#666;
  font-size:12px;
  line-height:1.5;
  white-space:normal;
}

.filter-box{
  margin-top:16px;
  padding:14px;
  background:#f7f7f7;
  border-radius:8px;
}

.filter-grid{
  display:grid;
  grid-template-columns:1fr 150px 180px;
  gap:12px;
  align-items:end;
}

.pager{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:10px;
  margin-top:14px;
}

.pager-info{
  color:#666;
  font-weight:bold;
}

#recordTable{
  table-layout:fixed;
}

#recordTable th:nth-child(1),
#recordTable td:nth-child(1){
  width:110px;
}

#recordTable th:nth-child(2),
#recordTable td:nth-child(2){
  width:40%;
}

#recordTable th:nth-child(3),
#recordTable td:nth-child(3){
  width:220px;
}

#recordTable th:nth-child(4),
#recordTable td:nth-child(4){
  width:260px;
}

#recordTable th:nth-child(5),
#recordTable td:nth-child(5){
  width:90px;
  text-align:center;
}

#recordTable td{
  vertical-align:top;
  border-bottom:none;
}

#recordTable tbody tr{
  border-bottom:1px solid #ddd;
}

@media screen and (max-width:700px){
  .filter-grid{
    display:block;
  }
}

@media screen and (max-width:900px){
  table,
  thead,
  tbody,
  tr,
  th,
  td{
    display:block;
  }

  thead{
    display:none;
  }

  tr{
    border:1px solid #ddd;
    border-radius:10px;
    margin-bottom:12px;
    padding:10px;
    background:#fff;
  }

  td{
    border-bottom:none;
    padding:7px 0;
  }

  .money{
    text-align:left;
  }
}
</style>
</head>

<body>

<header>
  <h1>研修会記録一覧</h1>
</header>

<main>
<div class="card">

  <div class="actions">
    <button class="btn" onclick="loadRecords()">再読み込み</button>
    <a class="btn sub" href="training-record-edit.html">記録入力</a>
    <a class="btn sub" href="venue-history.html">会場履歴</a>
    <a class="btn sub" href="index.html">メニューへ戻る</a>
  </div>

<div class="filter-box">
  <div class="filter-grid">

    <div>
      <label>検索</label>
	      <input id="keyword" placeholder="研修名・研修ID・主催・会場・講師・メモで検索" oninput="renderRecords(true)">
	    </div>

	    <div>
	      <label>年度</label>
	      <select id="yearFilter" onchange="renderRecords(true)">
	        <option value="">読み込み中</option>
	      </select>
	    </div>

	    <div>
	      <label>開催状態</label>
	      <select id="statusFilter" onchange="renderRecords(true)">
	        <option value="all">すべて</option>
	        <option value="upcoming">未開催</option>
	        <option value="today">開催中</option>
	        <option value="done">完了</option>
	      </select>
	    </div>

	  </div>
	</div>

  <div id="status" class="status">読み込み中...</div>

  <table id="recordTable" style="display:none;">
    <thead>
      <tr>
        <th>開催日</th>
        <th>研修会・会場</th>
        <th>参加状況</th>
        <th>費用・メモ</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="recordBody"></tbody>
  </table>

<div id="pager" class="pager" style="display:none;">
  <button class="btn sub" onclick="prevPage()">前へ</button>
  <span id="pageInfo" class="pager-info">1 / 1ページ</span>
  <button class="btn sub" onclick="nextPage()">次へ</button>
</div>

</div>
</main>

<script>
let allRecords = [];

let currentPage =
  1;

const pageSize =
  10;


function loadRecords(){

  const status =
    document.getElementById("status");

  const table =
    document.getElementById("recordTable");

  const tbody =
    document.getElementById("recordBody");

  const pager =
    document.getElementById("pager");

  status.textContent =
    "読み込み中...";

  table.style.display =
    "none";

  pager.style.display =
    "none";

  tbody.innerHTML =
    "";

  jsonp(
    "getTrainingRecordsJsonp",
    {},
    function(res){

      if(!res || !res.ok){
        status.innerHTML =
          '<span class="ng">研修会記録を取得できませんでした。</span>';
        return;
      }

      allRecords =
        res.records || [];

      allRecords.sort(function(a, b){

        const ad =
          String(a.eventDate || "");

        const bd =
          String(b.eventDate || "");

        return ad < bd ? 1 : -1;
      });

      renderYearOptions();

      renderRecords(
        true
      );
    }
  );
}


function renderRecords(resetPage){

  if(resetPage){
    currentPage =
      1;
  }

  const status =
    document.getElementById("status");

  const table =
    document.getElementById("recordTable");

  const tbody =
    document.getElementById("recordBody");

  const pager =
    document.getElementById("pager");

  tbody.innerHTML =
    "";

  const records =
    getFilteredRecords();

  if(records.length === 0){
    status.textContent =
      "条件に一致する研修会記録はありません。";

    table.style.display =
      "none";

    pager.style.display =
      "none";

    return;
  }

  const totalPages =
    Math.ceil(records.length / pageSize);

  if(currentPage > totalPages){
    currentPage =
      totalPages;
  }

  const start =
    (currentPage - 1) * pageSize;

  const pageRecords =
    records.slice(
      start,
      start + pageSize
    );

  pageRecords.forEach(function(item){

    appendRecordRow(
      item,
      tbody
    );
  });

  status.textContent =
    records.length + "件中 " +
    (start + 1) + "〜" +
    (start + pageRecords.length) +
    "件を表示 / 全" +
    allRecords.length +
    "件";

  document.getElementById("pageInfo").textContent =
    currentPage + " / " + totalPages + "ページ";

  table.style.display =
    "table";

  pager.style.display =
    totalPages > 1
      ? "flex"
      : "none";
}


function getFilteredRecords(){

  const keyword =
    document.getElementById("keyword").value.trim().toLowerCase();

  return allRecords.filter(function(t){

    if(!matchesYearFilter(t)){
      return false;
    }

    if(!matchesStatusFilter(t)){
      return false;
    }

    if(keyword){

      const text =
        [
          t.eventId,
          t.title,
          t.hostType,
          t.eventDate,
          t.venueName,
          t.lecturerName,
          t.lecturerOrg,
          t.costNote,
          t.eventMemo
        ].join(" ").toLowerCase();

      if(text.indexOf(keyword) === -1){
        return false;
      }
    }

    return true;
  });
}


function renderYearOptions(){

  const select =
    document.getElementById("yearFilter");

  const years =
    getRecordYears();

  select.innerHTML =
    '<option value="all">すべて</option>';

  years.forEach(function(year){

    const option =
      document.createElement("option");

    option.value =
      year;

    option.textContent =
      year + "年度";

    select.appendChild(option);
  });

  const currentYear =
    getCurrentFiscalYear();

  select.value =
    years.indexOf(currentYear) >= 0
      ? currentYear
      : "all";
}


function getRecordYears(){

  const map =
    {};

  allRecords.forEach(function(t){

    const year =
      getTrainingFiscalYear(t);

    if(year){
      map[year] =
        true;
    }
  });

  return Object.keys(map).sort(function(a, b){
    return Number(b) - Number(a);
  });
}


function getTrainingFiscalYear(t){

  const eventId =
    String(t && t.eventId ? t.eventId : "").trim();

  const match =
    eventId.match(/^(\d{4})-/);

  if(match){
    return match[1];
  }

  const eventDate =
    normalizeDateText(t && t.eventDate ? t.eventDate : "");

  if(!eventDate){
    return "";
  }

  const parts =
    eventDate.split("-");

  const year =
    Number(parts[0]);

  const month =
    Number(parts[1]);

  return String(month <= 3 ? year - 1 : year);
}


function getCurrentFiscalYear(){

  const now =
    new Date();

  const year =
    now.getFullYear();

  const month =
    now.getMonth() + 1;

  return String(month <= 3 ? year - 1 : year);
}


function matchesYearFilter(t){

  const yearFilter =
    document.getElementById("yearFilter").value;

  if(!yearFilter || yearFilter === "all"){
    return true;
  }

  return getTrainingFiscalYear(t) === yearFilter;
}


function appendRecordRow(item, tbody){

  const t =
    item;

  const s =
    item;

  const totalCost =
    toNumber(t.venueCost) +
    toNumber(t.lecturerCost) +
    toNumber(t.printCost) +
    toNumber(t.drinkCost) +
    toNumber(t.otherCost);

  const venueText =
    [
      t.venueName || "",
      t.startTime || t.endTime
        ? (t.startTime || "") + "〜" + (t.endTime || "")
        : ""
    ].filter(function(v){
      return v !== "";
    }).join(" / ");

  const lecturerText =
    [
      t.lecturerName || "",
      t.lecturerOrg || ""
    ].filter(function(v){
      return v !== "";
    }).join(" / ");

  const memoText =
    [
      t.costNote ? "費用: " + t.costNote : "",
      t.eventMemo || ""
    ].filter(function(v){
      return v !== "";
    }).join(" / ");

  const memoPreview =
    memoText.length > 70
      ? memoText.substring(0, 70) + "..."
      : memoText;

  const attendanceSummary =
    makeAttendanceSummary(t);

  const tr =
    document.createElement("tr");

  tr.innerHTML =
    '<td>' +
    escapeHtml(t.eventDate || "") +
    '</td>' +

    '<td>' +
    '<div class="record-title">' + escapeHtml(t.title || "") + '</div>' +
    '<div class="record-sub">' +
      escapeHtml(t.eventId || "") +
      (t.hostType ? " / " + escapeHtml(t.hostType) : "") +
    '</div>' +
    '<div class="compact-text">' +
      (venueText ? "会場: " + escapeHtml(venueText) : "会場: 未入力") +
      (lecturerText ? "<br>講師: " + escapeHtml(lecturerText) : "") +
    '</div>' +
    '</td>' +

    '<td class="record-summary">' + attendanceSummary + '</td>' +

    '<td class="memo-cell">' +
    '<div class="money">' + escapeHtml(formatMoney(totalCost) || "") + '</div>' +
    '<div class="memo-preview">' + escapeHtml(memoPreview || "") + '</div>' +
    '</td>' +

    '<td>' +
    '<a class="btn sub" href="training-record-edit.html?event=' +
    encodeURIComponent(t.eventId || "") +
    '">編集</a>' +
    '</td>';

  tbody.appendChild(tr);
}

function getNumberText(value){
  const text =
    String(value === null || value === undefined ? "" : value).trim();

  if(
    text === "" ||
    text === "未集計" ||
    !/^[0-9]+(\.[0-9]+)?$/.test(text)
  ){
    return "";
  }

  return text;
}

function getRateText(value){
  const text =
    String(value === null || value === undefined ? "" : value).trim();

  if(
    text === "" ||
    text === "未集計" ||
    text === "0.0%" ||
    text.indexOf("%") === -1
  ){
    return "";
  }

  return text;
}

function makeAttendanceChip(label, value, suffix, title, strong){
  const text =
    String(value === null || value === undefined ? "" : value).trim();

  if(!text){
    return "";
  }

  return '<span class="record-chip' +
    (strong ? " strong" : "") +
    '" title="' +
    escapeHtml(title || "") +
    '">' +
    escapeHtml(label) +
    " " +
    escapeHtml(value) +
    escapeHtml(suffix || "") +
    '</span>';
}

function makeAttendanceSummary(t){

  const eventDate =
    normalizeDateText(t.eventDate || "");

  if(eventDate && eventDate > getTodayText()){
    return '<span class="record-chip">未開催</span>';
  }

  const chips = [];

  const targetCount =
    getNumberText(t.targetCount);

  const totalAttended =
    getNumberText(t.totalAttendedCount) ||
    getNumberText(t.attendedCount);

  const attendedCount =
    getNumberText(t.attendedCount);

  const outsideAttendedCount =
    getNumberText(t.outsideAttendedCount);

  const attendanceRate =
    getRateText(t.attendanceRate);

  const totalAttendedNumber =
    Number(totalAttended || 0);

  const attendedNumber =
    Number(attendedCount || 0);

  const outsideAttendedNumber =
    Number(outsideAttendedCount || 0);

  const hasAnyAttendance =
    totalAttendedNumber > 0 ||
    attendedNumber > 0 ||
    outsideAttendedNumber > 0;

  if(targetCount){
    chips.push(
      makeAttendanceChip(
        "案内対象",
        targetCount,
        "件",
        "この研修の案内対象になっている会社数",
        false
      )
    );
  }

  if(hasAnyAttendance && totalAttended){
    chips.push(
      makeAttendanceChip(
        "参加合計",
        totalAttended,
        "件",
        "案内対象内・対象外を合わせた参加会社数",
        true
      )
    );
  }

  if(hasAnyAttendance && attendedCount){
    chips.push(
      makeAttendanceChip(
        "対象内参加",
        attendedCount,
        "件",
        "案内対象になっていて参加した会社数",
        false
      )
    );
  }

  if(hasAnyAttendance && outsideAttendedCount){
    chips.push(
      makeAttendanceChip(
        "対象外参加",
        outsideAttendedCount,
        "件",
        "案内対象ではないが参加した会社数",
        false
      )
    );
  }

  if(hasAnyAttendance && attendanceRate){
    chips.push(
      makeAttendanceChip(
        "参加率",
        attendanceRate,
        "",
        "案内対象に対する対象内参加の割合",
        false
      )
    );
  }

  if(chips.length){
    return chips.join("") +
      (
        hasAnyAttendance
          ? ""
          : '<span class="record-chip">参加なし</span>'
      );
  }

  return '<span class="muted">参加集計なし</span><br>' +
    '<a class="btn sub" href="history.html?event=' +
    encodeURIComponent(t.eventId || "") +
    '">参加履歴</a>';
}


function prevPage(){

  if(currentPage <= 1){
    return;
  }

  currentPage--;

  renderRecords(
    false
  );
}


function nextPage(){

  currentPage++;

  renderRecords(
    false
  );
}


function matchesStatusFilter(t){

  const statusFilter =
    document.getElementById("statusFilter").value;

  if(statusFilter === "all"){
    return true;
  }

  const eventDate =
    normalizeDateText(t.eventDate || "");

  if(!eventDate){
    return statusFilter === "upcoming";
  }

  const today =
    getTodayText();

  if(statusFilter === "upcoming"){
    return eventDate > today;
  }

  if(statusFilter === "today"){
    return eventDate === today;
  }

  if(statusFilter === "done"){
    return eventDate < today;
  }

  return true;
}


function normalizeDateText(value){

  const text =
    String(value || "").trim();

  if(!text){
    return "";
  }

  if(text.indexOf("/") !== -1){
    const parts =
      text.split("/");

    if(parts.length >= 3){
      return (
        parts[0].padStart(4, "0") + "-" +
        parts[1].padStart(2, "0") + "-" +
        parts[2].padStart(2, "0")
      );
    }
  }

  if(text.indexOf("-") !== -1){
    return text.substring(0, 10);
  }

  return text;
}


function getTodayText(){

  const d =
    new Date();

  const y =
    d.getFullYear();

  const m =
    String(d.getMonth() + 1).padStart(2, "0");

  const day =
    String(d.getDate()).padStart(2, "0");

  return y + "-" + m + "-" + day;
}


function toNumber(value){

  const n =
    Number(String(value || "").replace(/,/g, ""));

  return isNaN(n)
    ? 0
    : n;
}


function formatMoney(value){

  if(!value){
    return "";
  }

  return value.toLocaleString() + "円";
}


loadRecords();
</script>

</body>
</html>
